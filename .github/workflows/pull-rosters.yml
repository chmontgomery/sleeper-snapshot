name: Pull Sleeper rosters

on:
  schedule:
    - cron: "0 11 * * *" # daily 11:00 UTC = 5am CST (6am CDT); cron is UTC-only, no DST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pull-rosters
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull rosters
        run: python3 .claude/skills/pull-sleeper-rosters/scripts/pull_rosters.py | tee changes.txt

      - name: Pull weekly matchups, transactions and draft
        run: python3 .claude/skills/pull-sleeper-rosters/scripts/pull_history.py | tee -a changes.txt

      - name: Commit and push if changed
        run: |
          git add rosters.json players.json
          if [ -d history ]; then git add history; fi
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git commit -m "sleeper rosters snapshot $(date -u +%F) (automated)" -m "$(cat changes.txt)"
          git push

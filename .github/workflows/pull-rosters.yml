name: Pull Sleeper rosters

on:
  schedule:
    - cron: "0 11 * * *" # daily, 11:00 UTC (6-7am Central) after overnight waivers
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pull-rosters
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull rosters
        run: python3 .claude/skills/pull-sleeper-rosters/scripts/pull_rosters.py | tee changes.txt

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- rosters.json players.json; then
            echo "No roster changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add rosters.json players.json
          git commit -m "sleeper rosters snapshot $(date -u +%F) (automated)" -m "$(cat changes.txt)"
          git push
